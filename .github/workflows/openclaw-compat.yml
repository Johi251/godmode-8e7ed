name: OpenClaw Compatibility Check

# This personal Hermes copy does not maintain upstream OpenClaw releases.
# Run explicitly when evaluating a host upgrade; never auto-update or publish.
on:
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: "Optional OpenClaw version to test (blank tests the committed lockfile)"
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test an explicitly selected host version
        if: inputs.openclaw_version != ''
        env:
          OPENCLAW_VERSION: ${{ inputs.openclaw_version }}
        run: |
          if [[ ! "$OPENCLAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Enter a concrete OpenClaw version, for example 2026.3.23"
            exit 1
          fi
          pnpm add -D "openclaw@$OPENCLAW_VERSION" --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee typecheck.log
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build 2>&1 | tee build.log
      - name: Preserve compatibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-compatibility
          path: |
            typecheck.log
            build.log
            package.json
            pnpm-lock.yaml
          retention-days: 14
