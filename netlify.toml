[build]
  command = "npm --prefix ui ci --include=dev --ignore-scripts --no-audit --no-fund && npm --prefix ui run build"
  publish = "ui/dist"

[build.environment]
  NODE_VERSION = "22"
  OPENCLAW_CONTROL_UI_BASE_PATH = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
